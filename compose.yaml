services:
  web:
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////app/state/web.db
      STATE_DIR: /app/state
    volumes:
      - app-data:/app/state
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro
    command: ["uvicorn", "campushallen.web.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    stop_grace_period: 120s
  worker:
    build: .
    init: true
    profiles: [worker]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////app/state/web.db
      STATE_DIR: /app/state
    volumes:
      - app-data:/app/state
      - ./src:/app/src:ro
    command: ["campushallen-worker"]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 120s
volumes:
  app-data:
