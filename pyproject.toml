[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "campushallen-bot"
version = "0.1.0"
description = "Local Campushallen booking automation with Playwright"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "beautifulsoup4>=4.10,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "jinja2>=3.1.6,<4",
  "Babel>=2.17,<3",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23.1,<26",
  "cryptography>=50.0.2,<51",
  "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
browser = ["playwright>=1.47,<2"]
test = ["pytest>=8,<9"]
dev = ["playwright>=1.47,<2", "pytest>=8,<9", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "types-beautifulsoup4"]

[project.scripts]
campushallen-admin = "campushallen.cli:main"
campushallen-worker = "campushallen.worker:main"
campushallen-login = "campushallen.auth:main"
campushallen-book = "campushallen.booking:main"
campushallen-inspect-schedule = "campushallen.inspect_schedule:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campushallen = ["web/templates/*.html", "web/static/*.css", "web/static/*.js", "web/translations/*/LC_MESSAGES/*.po", "web/translations/*/LC_MESSAGES/*.mo"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/campushallen/settings.py", "src/campushallen/database", "src/campushallen/services", "src/campushallen/web", "src/campushallen/cli.py", "src/campushallen/worker.py", "src/campushallen/healthcheck.py"]
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["campushallen.api", "campushallen.booking", "campushallen.browser", "campushallen.nettrace", "campushallen.config", "campushallen.schedule"]
ignore_errors = true

# Leave the established CLI formatting intact while formatting all new modules.
[tool.ruff.format]
exclude = ["scripts/book.py", "scripts/login.py", "scripts/inspect_schedule.py", "tests/test_schedule.py", "tests/test_dynamic_group_activity.py", "tests/test_api.py", "tests/test_booking_target.py", "src/campushallen/auth.py", "src/campushallen/config.py", "src/campushallen/logging_config.py", "src/campushallen/booking.py", "src/campushallen/__init__.py", "src/campushallen/browser.py", "src/campushallen/api.py", "src/campushallen/schedule.py", "src/campushallen/nettrace.py", "src/campushallen/inspect_schedule.py"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["I001"]
"src/campushallen/{booking,config,logging_config,nettrace,schedule}.py" = ["I001"]
"tests/test_{api,booking_target,dynamic_group_activity,schedule}.py" = ["I001"]
