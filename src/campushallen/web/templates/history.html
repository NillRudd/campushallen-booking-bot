{% extends 'base.html' %}{% block content %}
<p class="eyebrow">ACTIVITY LOG</p><h1>Booking history.</h1>
<form action="/history" method="get" class="card"><div class="grid"><label>Account<select name="account_id" aria-label="Account"><option value="">All accounts</option>{% for account in accounts %}<option value="{{ account.id }}" {% if account_id == account.id %}selected{% endif %}>{{ account.display_name }}</option>{% endfor %}</select></label><label>Result<select name="result" aria-label="Result"><option value="">All results</option>{% for outcome in outcomes %}<option value="{{ outcome.value }}" {% if result == outcome.value %}selected{% endif %}>{{ outcome.value|friendly_result }}</option>{% endfor %}</select></label><label>Activity date<input type="date" name="date" value="{{ date_value or '' }}"></label></div><div class="actions"><button>Filter history</button><a href="/history">Clear filters</a></div></form>
{% include 'attempts.html' %}<div class="actions">{% if page > 1 %}<a href="{{ previous_url }}">← Newer</a>{% endif %}<span>Page {{ page }}</span>{% if recent|length == 50 %}<a href="{{ next_url }}">Older →</a>{% endif %}</div>
{% endblock %}
