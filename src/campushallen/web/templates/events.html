<div class="table-wrap"><table><thead><tr><th>{{ _("Event") }}</th><th>{{ _("Time") }}</th><th>{{ _("User ID") }}</th></tr></thead><tbody>{% for event in events %}<tr><td>{{ event.code|event_label }}{% if user.is_admin %}<br><small>{{ _('Code') }}: {{ event.code }}</small>{% endif %}</td><td>{{ event.created_at|localtime }}</td><td>{{ event.user_id or '—' }}</td></tr>{% else %}<tr><td colspan="3">{{ _("No security events yet.") }}</td></tr>{% endfor %}</tbody></table></div>
