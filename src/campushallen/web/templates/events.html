<div class="table-wrap"><table><thead><tr><th>Event</th><th>Time</th><th>User ID</th></tr></thead><tbody>{% for event in events %}<tr><td>{{ event.code|replace('_',' ')|title }}</td><td>{{ event.created_at|localtime }}</td><td>{{ event.user_id or '—' }}</td></tr>{% else %}<tr><td colspan="3">No security events yet.</td></tr>{% endfor %}</tbody></table></div>
